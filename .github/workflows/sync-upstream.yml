# Keep `patched` (the branch ALAS deploys from) up to date with upstream.
#
# - Fork `master` mirrors upstream `master`, fast-forward only.
# - Upstream `master` is merged into `patched`. Never rebase or force-push:
#   ALAS skips updating forever if the deployed commit becomes unreachable
#   (module/webui/updater.py `Cannot find local commit ... skip update`).
# - On merge conflict the job fails and `patched` stays at the last good commit.
#   GitHub emails the failure to whoever last modified the cron below, and the
#   last step sends it to Telegram (secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID).

name: Sync upstream

on:
  schedule:
    # 03:23 Asia/Shanghai is right before ALAS AutoRestartTime 03:50
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Fail on purpose to test failure notification'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "::error::Simulated failure to test notification"
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: patched
          fetch-depth: 0
          filter: blob:none

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git fetch upstream master

      - name: Mirror upstream master to fork master
        # Plain push, fails instead of overwriting if fork master ever diverges
        run: git push origin refs/remotes/upstream/master:refs/heads/master

      - name: Merge upstream master into patched
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "patched already contains upstream/master"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit upstream/master
          git push origin HEAD:patched

      - name: Notify Telegram on failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: >-
            ALAS fork sync failed (${{ github.event_name }}), patched stays at the last good commit.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail-with-body --max-time 30 -o /dev/null \
            -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
