# Keep the fork's master a pure mirror; only publish a validated merge to patched.
name: Sync upstream

on:
  schedule:
    # Asia/Shanghai: 03:23, 09:23, 15:23, 21:23.
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Fail on purpose to test failure notification'
        type: boolean
        default: false

permissions: {}
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Simulate failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo '::error::Simulated failure to test notification'
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Fast-forward master mirror
        run: |
          git fetch https://github.com/LmeSzinc/AzurLaneAutoScript.git master
          git push origin FETCH_HEAD:refs/heads/master

  prepare:
    needs: mirror
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      fingerprint: ${{ steps.prepare.outputs.fingerprint }}
      patched: ${{ steps.prepare.outputs.patched }}
      upstream: ${{ steps.prepare.outputs.upstream }}
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge and validate without write credentials
        id: prepare
        run: bash .github/scripts/sync-prepare.sh
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.mode == 'candidate'
        with:
          name: sync-candidate
          path: ${{ runner.temp }}/candidate.bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [mirror, prepare]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'candidate'
        with:
          name: sync-candidate
          path: ${{ runner.temp }}
      - name: Publish checked commit or record merge incident
        id: publish
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MODE: ${{ needs.prepare.outputs.mode }}
          EXPECTED_PATCHED: ${{ needs.prepare.outputs.patched }}
          EXPECTED_UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          FINGERPRINT: ${{ needs.prepare.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash .github/scripts/sync-publish.sh
      - name: Notify Telegram of unexpected failure
        if: ${{ failure() && steps.publish.outputs.handled != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail-with-body --max-time 30 -o /dev/null \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=ALAS sync failed; check the failed step. $RUN_URL" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"
